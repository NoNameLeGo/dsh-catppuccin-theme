# 持续集成：普通提交与 PR 上的验证。
#
# 与 publish.yml 的分工：这里只验证（install / typecheck / build / test），
# 不带任何发布权限；发版仍由 publish.yml 在 `v*` tag 上做（OIDC 可信发布）。
#
# 为什么需要单独一个文件：publish.yml 只在 tag 推送或手动 dispatch 时触发，
# 于是 main 上的普通提交从来没人验证——2026-09-15 两次发版失败都是这个空档造成
# 的（一个未声明的幽灵类型依赖、一个跨测试污染，本地都恰好过）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本由 package.json 的 packageManager 单点决定：
      # 这里刻意不传 `version:`（两者字符串不等时 action-setup 会直接抛错）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck && pnpm typecheck:tests

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # 启动级检查（EE+FF 合并立项的 D 方案）：建一个临时 DSH_HOME、把本仓库 link 进它的 web
  # profile、真起 `dsh web`，然后用 Playwright 断言「插件真被加载 / 风味真生效 / 玻璃真能切 /
  # 关键区域的计算样式符合不变量」。**刻意不做整图像素对比**——理由与取舍见
  # docs/plugin-improvements.md §3.9（断言式采样不随字体/渲染器漂移，且仓库已有很强的样式级断言）。
  #
  # 为什么单独一个 job：它要装宿主、下载 Chromium（~150 MB），不该让每次 typecheck/test 都付这笔钱；
  # 宿主与浏览器都放全局，仓库的 devDependencies 不为「能跑一次 e2e」而变重。
  # `dsh` 刻意钉版本：它换版本就可能换掉首次运行引导的步骤，而那是本检查的前置。
  # 钉的是**两层**：`dsh` 的版本 + 下面 `npm i` 的 `--before` 树冻结（理由见那一步的注释）。
  boot-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # pnpm store 也被缓存：宿主会在临时 profile 里做一次安装，命中缓存后是秒级。
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `--before` 把整棵依赖树冻结到宿主钉的版本所处的时代。不加它时 npm 会把
      # `^0.1.5-rc.1` 这类子依赖解析到**当时最新**的 rc —— 2026-09-22 上游把 `next`
      # 推到 `0.1.5-rc.3` 时漏发了 `@deepseek-ai/dsh-client-ui-sidebar-documentpreview`
      # （该包只到 rc.2），树因此残缺：同一步先表现为 npm 解析循环 9.5 分钟后
      # `JavaScript heap out of memory`（run 35691580473），重跑则直接
      # `ETARGET … sidebar-documentpreview@^0.1.5-rc.3`（run 35693097971 重跑）。
      # 冻结到 2026-09-21（rc.3 发布前、当时 boot-e2e 全绿）后，这一步只取决于
      # 上游那段已发布且自洽的版本区间，与「上游正在发版」解耦。
      - name: Install dsh + Playwright
        run: |
          npm i -g @deepseek-ai/dsh@0.1.5-rc.1 playwright --before=2026-09-21T00:00:00Z --no-fund --no-audit
          echo "DSH_BIN=$(npm root -g)/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        # 直接走全局装的 playwright 的 cli.js，避免 `npx playwright` 在本地没装时又去拉一个不同版本。
        run: node "$(npm root -g)/playwright/cli.js" install --with-deps chromium

      - name: Boot check
        run: node scripts/e2e-boot-check.cjs
