# 自动化发布到 npm（OIDC Trusted Publishing）
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.1.1）——正式发布
#   2. workflow_dispatch —— 手动触发
#
# 前置条件（一次性，npmjs.com 网页端配置）：
#   Package Settings → Trusted Publisher → GitHub Actions：
#   Organization or user: NoNameLeGo
#   Repository:           dsh-catppuccin-theme
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#
# 工作流内不存任何 npm token：发布身份来自 GitHub OIDC，每次发布使用
# 短期凭证（需 id-token: write 权限）。

name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC：向 npm 换取短期发布凭证（必需）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # registry-url 故意省略：一旦设置，setup-node 会写带
      # `_authToken=${NODE_AUTH_TOKEN}` 的 ~/.npmrc 并可能导出占位
      # NODE_AUTH_TOKEN，它会抢占 OIDC 令牌交换（可信发布），表现为
      # registry 返回误导性的 404 / ENEEDAUTH。见 actions/setup-node#1440。
      # OIDC 下 npm 默认即 registry.npmjs.org，发布命令里再显式 --registry。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 方案 A：changelog 门禁——正式版（版本号不含 `-`）发布前必须已在
      # CHANGELOG.md 写好对应版本条目，防止「忘了更新日志」。
      # 预发布（beta）跳过：beta 迭代频繁，正式化时再补正式条目。
      - name: Verify changelog entry
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) echo "预发布 $VERSION：跳过 changelog 校验"; exit 0 ;;
          esac
          grep -qE "^## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md 缺少 [$VERSION] 条目，拒绝发布"
            echo "::error::生成草稿：pnpm changelog:gen && pnpm changelog:gen -- --write"
            exit 1
          }
          echo "✓ CHANGELOG.md 已包含 [$VERSION] 条目"

      # 仓库 .npmrc 指向 npmmirror，发布必须显式走 npmjs 才能命中 OIDC 信任。
      # prerelease 版本（如 0.2.5-beta.0）npm 强制要求 --tag，按版本自动选择：
      # 正式版 → latest，预发布 → beta。
      #
      # `env -u NODE_AUTH_TOKEN` 是关键：npm 11.x 的 OIDC 可信发布检测条件是
      # `process.env.NODE_AUTH_TOKEN === undefined`（不是空值）。GitHub runner
      # 会把 setup-node 注入的 NODE_AUTH_TOKEN（占位值）重新塞回每个步骤的
      # 环境，即使 bash `unset` 也会被覆盖；`env -u` 在 exec(2) 层面真正把它
      # 从 npm 进程环境里移除，npm 才会回落到 OIDC 令牌交换而非走 token 鉴权。
      - name: Publish to npm
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'beta' : 'latest'")
          env -u NODE_AUTH_TOKEN npm publish --registry=https://registry.npmjs.org --tag "$TAG"
