# 自动化发布到 npm（OIDC Trusted Publishing）
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.1.1）——正式发布
#   2. workflow_dispatch —— 手动触发
#
# 前置条件（一次性，npmjs.com 网页端配置）：
#   Package Settings → Trusted Publisher → GitHub Actions：
#   Organization or user: NoNameLeGo
#   Repository:           dsh-catppuccin-theme
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#
# 工作流内不存任何 npm token：发布身份来自 GitHub OIDC，每次发布使用
# 短期凭证（需 id-token: write 权限）。

name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC：向 npm 换取短期发布凭证（必需）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 仓库 .npmrc 指向 npmmirror，发布必须显式走 npmjs 才能命中 OIDC 信任。
      # prerelease 版本（如 0.2.5-beta.0）npm 强制要求 --tag，按版本自动选择：
      # 正式版 → latest，预发布 → beta。
      #
      # NODE_AUTH_TOKEN: '' 是关键：actions/setup-node 的 registry-url 会写
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` 并默认导出一个
      # 假的占位 token（XXXXX-...），npm 优先拿它走 classic 鉴权而非 OIDC，
      # registry 于是回一个误导性的 404（"not found / no permission"）。
      # 置空该变量让 npm 忽略占位值、回落到 OIDC Trusted Publishing。
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'beta' : 'latest'")
          npm publish --registry=https://registry.npmjs.org --tag "$TAG"
