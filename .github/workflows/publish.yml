# 自动化发布到 npm（OIDC Trusted Publishing）
#
# 触发方式：
#   1. 推送 v* 标签（如 v0.1.1）——正式发布
#   2. workflow_dispatch —— 手动触发
#
# 前置条件（一次性，npmjs.com 网页端配置）：
#   Package Settings → Trusted Publisher → GitHub Actions：
#   Organization or user: NoNameLeGo
#   Repository:           dsh-catppuccin-theme
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#
# 工作流内不存任何 npm token：发布身份来自 GitHub OIDC，每次发布使用
# 短期凭证（需 id-token: write 权限）。

name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC：向 npm 换取短期发布凭证（必需）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # registry-url 故意省略：一旦设置，setup-node 会写带
      # `_authToken=${NODE_AUTH_TOKEN}` 的 ~/.npmrc 并可能导出占位
      # NODE_AUTH_TOKEN，它会抢占 OIDC 令牌交换（可信发布），表现为
      # registry 返回误导性的 404 / ENEEDAUTH。见 actions/setup-node#1440。
      # OIDC 下 npm 默认即 registry.npmjs.org，发布命令里再显式 --registry。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # 诊断步骤（定位 OIDC 可信发布为何 ENEEDAUTH；确认后可删）
      - name: Diagnose OIDC auth
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "id-token-request-url set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "id-token-request-token set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "npmrc global: $(npm config get registry)"
          gh api "https://api.github.com/orgs/NoNameLeGo" -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" > /dev/null 2>&1 && echo "github api reachable with oidc token" || echo "github api not reachable"

      # 仓库 .npmrc 指向 npmmirror，发布必须显式走 npmjs 才能命中 OIDC 信任。
      # prerelease 版本（如 0.2.5-beta.0）npm 强制要求 --tag，按版本自动选择：
      # 正式版 → latest，预发布 → beta。
      - name: Publish to npm
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'beta' : 'latest'")
          npm publish --registry=https://registry.npmjs.org --tag "$TAG"
